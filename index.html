<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layout</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='3' fill='%23f4f1ec' stroke='%23333' stroke-width='2.5'/%3E%3Cpath d='M3 15h14V3M17 15v14' stroke='%23333' stroke-width='2.5' fill='none'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name" data-i18n="app.title"></span>
      </div>

      <select id="plan-select" class="plan-select" aria-label="Plan"></select>
      <div class="group">
        <button id="new-plan" class="btn" type="button" data-i18n="toolbar.new" data-i18n-title="toolbar.newHint"></button>
        <button id="open-file" class="btn" type="button" data-i18n="toolbar.open" data-i18n-title="toolbar.openHint"></button>
        <button id="save-file" class="btn" type="button" data-i18n="toolbar.save" data-i18n-title="toolbar.saveHint"></button>
      </div>
      <input id="file-input" type="file" accept=".json,application/json,image/*,.pdf,application/pdf" hidden />
      <div class="group">
        <button id="undo" class="btn btn--icon" type="button" data-i18n-title="toolbar.undo" aria-label="Undo">↶</button>
        <button id="redo" class="btn btn--icon" type="button" data-i18n-title="toolbar.redo" aria-label="Redo">↷</button>
      </div>

      <div class="seg" role="group" id="layout-modes">
        <button type="button" data-layout="plan" data-i18n="layout.plan"></button>
        <button type="button" data-layout="split" data-i18n="layout.split" class="only-wide"></button>
        <button type="button" data-layout="3d" data-i18n="layout.3d"></button>
      </div>

      <button id="panel-toggle" class="btn btn--icon panel-toggle" type="button" aria-label="Panel">☰</button>
    </header>

    <main class="main">
      <div id="workspace" class="workspace" data-layout="split">
        <section class="pane pane--plan">
          <nav class="tools" id="tools">
            <button type="button" data-tool="select" title="V"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z"/></svg><span data-i18n="tool.select"></span></button>
            <button type="button" data-tool="wall" title="W"><svg viewBox="0 0 24 24"><path d="M3 17h12V5" class="thick"/></svg><span data-i18n="tool.wall"></span></button>
            <button type="button" data-tool="arc" title="A"><svg viewBox="0 0 24 24"><path d="M4 19A15 15 0 0 1 19 4" class="thick"/></svg><span data-i18n="tool.arc"></span></button>
            <button type="button" data-tool="rect" title="R"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" class="thick"/></svg><span data-i18n="tool.rect"></span></button>
            <button type="button" data-tool="circle" title="C"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" class="thick"/></svg><span data-i18n="tool.circle"></span></button>
            <button type="button" data-tool="door" title="D"><svg viewBox="0 0 24 24"><path d="M4 20h16M6 20V8M6 8a12 12 0 0 1 12 12" /></svg><span data-i18n="tool.door"></span></button>
            <button type="button" data-tool="window" title="N"><svg viewBox="0 0 24 24"><path d="M3 9h18M3 15h18M3 12h18M3 9v6M21 9v6" /></svg><span data-i18n="tool.window"></span></button>
            <button type="button" data-tool="slider" title="S"><svg viewBox="0 0 24 24"><path d="M3 10h11M10 14h11M3 7v10M21 7v10" /></svg><span data-i18n="tool.slider"></span></button>
            <button type="button" data-tool="passage" title="O"><svg viewBox="0 0 24 24"><path d="M2 12h6M16 12h6M8 8v8M16 8v8" class="thick"/></svg><span data-i18n="tool.passage"></span></button>
            <button type="button" data-tool="room" title="T"><svg viewBox="0 0 24 24"><path d="M5 7h14M12 7v12" /></svg><span data-i18n="tool.room"></span></button>
            <hr />
            <span class="tools__caption" data-i18n="tool.drawing"></span>
            <button type="button" id="add-underlay" data-i18n-title="tool.addDrawingHint"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg><span data-i18n="tool.addDrawing"></span></button>
            <button type="button" data-tool="calibrate" data-needs-underlay data-i18n-title="tool.calibrateHint"><svg viewBox="0 0 24 24"><path d="M3 15l12-12 6 6-12 12zM7 11l2 2M10 8l2 2M13 5l2 2"/></svg><span data-i18n="tool.calibrate"></span></button>
            <button type="button" data-tool="moveUnderlay" data-needs-underlay data-i18n-title="tool.moveUnderlayHint"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><span data-i18n="tool.moveUnderlay"></span></button>
            <label class="tools__range" data-needs-underlay><span data-i18n="tool.opacity"></span><input id="underlay-opacity" type="range" min="0.1" max="1" step="0.05" value="0.55" /></label>
            <label class="tools__check" data-needs-underlay><input id="underlay-visible" type="checkbox" checked /><span data-i18n="tool.showDrawing"></span></label>
            <button type="button" id="remove-underlay" data-needs-underlay class="tools__small" data-i18n="tool.removeDrawing"></button>
            <hr />
            <button type="button" id="fit" data-i18n-title="tool.fitHint"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span data-i18n="tool.fit"></span></button>
          </nav>
          <div class="plan-area">
            <div class="tool-opts" id="tool-opts">
              <label data-for="wall arc rect circle"><span data-i18n="tool.kind"></span><select id="opt-wall-kind"></select></label>
              <label data-for="wall arc rect circle"><span data-i18n="tool.thickness"></span><input id="opt-thickness" type="number" min="1" max="100" step="1" /><span class="unit" data-i18n="unit.cm"></span></label>
              <label data-for="room"><span data-i18n="tool.roomType"></span><select id="opt-room-type"></select></label>
            </div>
            <div id="plan2d" class="plan2d-host"></div>
            <div id="status" class="status"></div>
          </div>
        </section>

        <section class="pane pane--3d">
          <div class="view3d-bar">
            <div class="seg" role="group" id="view-modes">
              <button type="button" data-mode="cutaway" data-i18n="view.cutaway"></button>
              <button type="button" data-mode="wallsUp" data-i18n="view.wallsUp"></button>
              <button type="button" data-mode="wallsDown" data-i18n="view.wallsDown"></button>
              <button type="button" data-mode="walk" data-i18n="view.walk"></button>
            </div>
            <label class="field field--time">
              <span class="field__label" data-i18n="toolbar.time"></span>
              <input id="time" type="range" min="6" max="20" step="0.25" value="10" />
              <output id="time-out">10:00</output>
            </label>
            <label class="field" id="level-field" hidden>
              <span class="field__label" data-i18n="panel.levels"></span>
              <select id="level-select"></select>
            </label>
            <label class="field">
              <span class="field__label" data-i18n="toolbar.quality"></span>
              <select id="quality">
                <option value="high" data-i18n="quality.high"></option>
                <option value="low" data-i18n="quality.low"></option>
              </select>
            </label>
          </div>
          <div id="stage" class="stage">
            <div id="labels" class="labels"></div>
            <div id="hint" class="hint"></div>
            <div id="stats" class="stats"></div>
          </div>
        </section>
        <div id="drop" class="drop" hidden><span data-i18n="toolbar.openHint"></span></div>
        <div id="toast" class="toast" hidden></div>
      </div>

      <aside id="panel" class="panel">
        <section>
          <h2 class="panel__title" id="props-title"></h2>
          <div id="props" class="props"></div>
        </section>
        <section>
          <h2 class="panel__title"><span data-i18n="panel.rooms"></span></h2>
          <ul id="rooms" class="rooms"></ul>
          <div class="rooms__total"><span data-i18n="panel.total"></span><span id="total-area"></span></div>
        </section>
        <section>
          <h2 class="panel__title" data-i18n="panel.issues"></h2>
          <ul id="issues" class="issues"></ul>
        </section>
      </aside>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
